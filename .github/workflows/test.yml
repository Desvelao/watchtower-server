name: Test

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    # Tailwind 4's @tailwindcss/oxide needs Node >= 20, and vitest 4's own
    # toolchain (nopt, transitively) needs >= 22 - see CLAUDE.md.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: public/yarn.lock

      - name: Install dependencies
        working-directory: public
        run: yarn install --frozen-lockfile

      - name: Run tests
        working-directory: public
        run: yarn test

      - name: Build
        working-directory: public
        run: yarn build

  # There is no Lua unit test suite yet (see CLAUDE.md) - this only proves
  # the server + worker images still build cleanly, the same coverage
  # docker-publish.yml already relies on for a real release.
  server-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/images/prod/server/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  worker-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/images/dev/worker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
