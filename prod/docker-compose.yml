version: "3.8"

services:
  server:
    image: ghcr.io/desvelao/watchtower-server:v0.0.1
    container_name: monitor-server
    ports:
      - "8080:8080" # Expose the Lapis server on port 8080
    environment:
      LAPIS_ENV: production
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      # DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # ===== AUTH =====
      JWT_SECRET: ${JWT_SECRET}
      # First admin account, bootstrapped idempotently on server boot -
      # leave unset (or ignore) once you've created your own admin user.
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      # ===== EMBEDDED WORKER =====
      USE_EMBED_WORKER: ${USE_EMBED_WORKER:-0}
      WORKER_CONFIG_FILE: ${WORKER_CONFIG_FILE:-}
    # command: lapis server development # Start Lapis in development mode
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:14
    container_name: monitor-server-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432" # Expose PostgreSQL on port 5432
    volumes:
      - ./postgres:/var/lib/postgresql/data
      - "../config/dataset:/docker-entrypoint-initdb.d"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
