version: "3.8"

services:
  server:
    image: ghcr.io/desvelao/watchtower-server:v0.0.1
    container_name: monitor-server
    ports:
      - "8080:8080" # Expose the Lapis server on port 8080
    environment:
      LAPIS_ENV: production
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      # DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    # command: lapis server development # Start Lapis in development mode
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:14
    container_name: monitor-server-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432" # Expose PostgreSQL on port 5432
    volumes:
      - ./postgres:/var/lib/postgresql/data
      - "../config/dataset:/docker-entrypoint-initdb.d"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
