worker_processes ${{NUM_WORKERS}};
error_log stderr notice;
daemon off;
pid logs/nginx.pid;
env POSTGRES_USER;
env POSTGRES_PASSWORD;
env POSTGRES_DB;
env POSTGRES_PORT;
env POSTGRES_HOST;
env DATABASE_URL;
env JWT_SECRET;
env INITIAL_ADMIN_USERNAME;
env INITIAL_ADMIN_PASSWORD;
env USE_EMBED_WORKER;
env USE_EMBED_SCHEDULER;
env USE_EMBED_DELIVER;
env USE_EMBED_EVALUATOR;
env WORKER_CONFIG_FILE;
env SERVER_API_KEY;
env SERVER_API_KEY_FILE;
env SMTP_HOST;
env SMTP_PORT;
env SMTP_USER;
env SMTP_PASSWORD;
env SMTP_PASSWORD_FILE;
env SMTP_FROM;
env SMTP_SSL;
# Makes ../shared/*.lua requireable as bare module names (e.g.
# require("rule_expr")) - set via LUA_PATH in the environment (see
# dev/docker-compose.yml, docker/images/prod/server/Dockerfile), not a
# lua_package_path directive here.
env LUA_PATH;

events {
  worker_connections 1024;
}

http {
  include mime.types;

  lua_shared_dict rate_limit_store 10m;

  # Needed for any cosocket-based TLS verification (e.g.
  # server/lib/resty_webhook_transport.lua's lua-resty-http client, used by
  # the embedded worker's "deliver" role tick) - OpenResty's
  # ngx.socket.tcp():sslhandshake() doesn't fall back to the OS's default
  # trust store the way curl/wget do; without this directive, `ssl_verify =
  # true` always fails with "unable to get local issuer certificate".
  # Alpine's ca-certificates package (already installed on the
  # openresty/openresty:alpine base image) provides this bundle.
  lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

  # Also declared inside the `server` block below for request-time
  # queries; needed here too because init_worker_by_lua_block below runs
  # DB queries (bootstrap_admin, the embedded worker) outside any `server`
  # context, where the resolver directive nested only in `server` isn't
  # visible - without it, resolving the `db` container hostname at worker
  # startup fails with "no resolver defined to resolve ...".
  # ipv6=off: cosocket connects (worker_plugins/watchtower_observer_web_scraper/resty_transport.lua,
  # resty_webhook_transport.lua, lua-resty-mail) use whichever address the
  # resolver returns with no IPv4/IPv6 fallback of their own (unlike curl's
  # Happy Eyeballs) - if a target host has an AAAA record but this
  # container/host has no IPv6 route, that resolves fine but the connect
  # itself fails with "network unreachable". Since IPv6 egress isn't
  # available in this dev environment, force IPv4-only resolution instead
  # of silently failing on any dual-stack site.
  resolver 127.0.0.11 ipv6=off;

  init_by_lua_block {
    require "lpeg"
  }

  init_worker_by_lua_block {
    -- Only the first nginx worker process bootstraps the initial admin
    -- account and (optionally) starts the embedded worker - both
    -- guard themselves on ngx.worker.id() == 0 internally, but requiring
    -- them here (rather than from app.lua's top level) is what actually
    -- matters: with lua_code_cache off in dev, app.lua is re-required on
    -- every request, and real DB I/O inside a module body that gets
    -- required per-request hits OpenResty's "attempt to yield across
    -- C-call boundary". Both modules defer their DB work into
    -- ngx.timer.at(0, ...) to sidestep that.
    require("workers.bootstrap_admin")

    if os.getenv("USE_EMBED_WORKER") == "1" then
      require("workers.observe_pending_worker")
    end
  }

  server {
    listen ${{PORT}};
    # https://github.com/leafo/lapis/issues/171#issuecomment-478909564
    # ipv6=off: see the http-block resolver directive's comment above.
    resolver 127.0.0.11 ipv6=off;
    lua_code_cache ${{CODE_CACHE}};

    # CORS
    location /api/ {
      add_header Access-Control-Allow-Origin '*';
      add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS';
      add_header Access-Control-Allow-Headers 'X-Requested-With, Content-Type, Authorization';
      default_type text/html;
      content_by_lua_block {
        require("lapis").serve("app")
      }
    }

    location /static/ {
      alias static/;
    }

    location /favicon.ico {
      alias static/favicon.ico;
    }

    # Serve the frontend assets
    location /assets/ {
      alias static/assets/;
    }

    # Specify the default index file.
    # index /static/index.html;

    # Serve all requests by trying the file directly; if not found, fallback to index.html.
    location / {
        try_files $uri $uri/ /static/index.html;
    }
  }
}
