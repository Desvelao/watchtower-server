openapi: 3.0.3
info:
  title: watchtower-server API
  description: |
    HTTP API for watchtower-server: observables, notification
    channels, a boolean-expression rule engine, and the worker/job
    registry a worker (embedded or standalone) reports through.

    Every endpoint requires authentication - either a JWT bearer token
    (from `/api/auth/login`) or an API key (`x-api-key` header) - and,
    once authenticated, an RBAC permission tied to the caller's role. See
    CLAUDE.md's "Users & roles" section for the live-enforcement design
    (disabling a user, editing a role, or narrowing an API key's owner's
    permissions takes effect on the very next request, no re-login).
  version: "0.1.0-alpha2"
servers:
  - url: http://localhost:8080
    description: Local development server (dev/docker-compose.yml)
security:
  - bearerAuth: []
  - apiKeyAuth: []
tags:
  - name: Health
    description: Unauthenticated liveness check for container/orchestrator probes
  - name: Auth
    description: Login and API key management
  - name: Users
    description: DB-backed user accounts - the first admin is bootstrapped from INITIAL_ADMIN_USERNAME/INITIAL_ADMIN_PASSWORD
  - name: Roles
    description: Named permission sets assigned to users - the permission catalog is fixed in code, only role -> permission-set assignment is dynamic
  - name: ObservableTypes
    description: Admin-defined schemas (properties + observation_schema) that Observables and Observations are validated against
  - name: Observables
    description: The things being tracked
  - name: Observations
    description: Observation ingest/history - posting one only stores it (no rule matching runs in the request); alerts are raised later by an "analyzer"-role worker
  - name: Alerts
    description: Fired alert instances - created by "analyzer"-role workers (via POST /api/alerts for the standalone worker, in-process for the embedded one), never as a side effect of ingesting an Observation; also readable and deletable
  - name: Rules
    description: The condition DSL the RuleEngine matches against new Observations
  - name: Workers
    description: Worker registry - self-reported identity and health via heartbeat
  - name: Scheduler
    description: Task definitions a "scheduler"-role worker evaluates (cron or one-shot), generating observe/analyze/notify/deliver work for the matching role
  - name: Jobs
    description: One row per (worker, type, ref) work assignment a worker reports on
  - name: NotificationChannels
    description: Discord/webhook destinations
  - name: NotificationPolicies
    description: Routes fired Alerts to NotificationChannels, via the same condition DSL Rules use - evaluated by a scheduler task of type='notify'
  - name: ObserverConfigs
    description: Admin-authored per-observable-type extraction config (fields + mechanism_config) the observer reads, plus the async ad-hoc "test this config" flow

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
  responses:
    Unauthorized:
      description: Missing/invalid/expired credentials, or the account is disabled
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              message: { type: string }
    Forbidden:
      description: Authenticated, but missing the required permission
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              message: { type: string }
              required_permission: { type: string }
  schemas:
    User:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        role_id: { type: integer }
        enabled: { type: boolean }
        created_at: { type: string }
        updated_at: { type: string }
    Role:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        permissions:
          type: array
          items: { type: string }
    PropertyDefinition:
      type: object
      description: >-
        One entry of an observable type's `properties` or `observation_schema`
        array. See docs/dev/observable-types-storage.md for the full
        reference.
      properties:
        name:
          type: string
          description: Storage key within a properties object. Must match ^[a-z][a-z0-9_]*$.
        label: { type: string }
        description:
          type: string
          description: >-
            Informational text shown near the field's input by schema-driven
            forms (e.g. SchemaFieldsForm). Must be a string if present.
        group:
          type: string
          description: >-
            UI grouping label - fields sharing the same value are rendered
            together under one heading, in schema order. Must be a string if
            present.
        type:
          type: string
          enum: [string, number, boolean, date, url, enum, map]
        multiple:
          type: boolean
          description: If true, the value is an array of the base type.
        required: { type: boolean }
        searchable:
          type: boolean
          description: If true (string/url/enum types only), included in the resource's free-text search.
        list_column:
          type: boolean
          description: >-
            Only meaningful in an observable type's observer_config_schema /
            observer_mechanism_schema: shows the field as an extra column in the
            Observer Configs table when that type is the active filter. Defaults
            to false.
        validations:
          type: object
          description: >-
            Allowed keys depend on `type`: string/url -> minLength, maxLength,
            pattern; number/date -> min, max; enum -> options (required,
            non-empty array of strings); boolean -> none.
    ImportRowErrors:
      type: array
      description: One entry per import row that was skipped; empty when nothing failed.
      items:
        type: object
        properties:
          index: { type: integer, description: 1-based position of the row in the uploaded file's array }
          name: { type: string, description: The row's `name`, when it has one }
          message: { type: string }
        required: [index, message]
    ObservableType:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        label: { type: string, nullable: true }
        description: { type: string, nullable: true }
        properties:
          type: array
          items: { $ref: '#/components/schemas/PropertyDefinition' }
        observation_schema:
          type: array
          items: { $ref: '#/components/schemas/PropertyDefinition' }
        created_at: { type: string }
        updated_at: { type: string }
    Observable:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        observable_type_id: { type: integer }
        enabled: { type: boolean }
        properties:
          type: object
          additionalProperties: true
          description: Values keyed by property name, shaped by this observable's observable_type.properties.
        last_observe_status:
          type: string
          enum: [pending, triggering, acknowledged, error]
          nullable: true
        last_observe_worker: { type: string, nullable: true }
        last_observe_take_at: { type: string, nullable: true }
        last_observe_ack_at: { type: string, nullable: true }
    Observation:
      type: object
      properties:
        id: { type: integer }
        observable_id: { type: integer }
        properties:
          type: object
          additionalProperties: true
          description: Values keyed by property name, shaped by the owning observable's observable_type.observation_schema.
        worker:
          type: string
          nullable: true
          description: >-
            The worker_id that produced this observation - usable in rule definitions via the
            generic `worker` field - see the Rules section.
        timestamp: { type: string }
    Alert:
      type: object
      properties:
        id: { type: integer }
        severity:
          type: string
          enum: [low, medium, high, critical]
        observation_id: { type: integer }
        rule_id: { type: integer, nullable: true }
        rule_name: { type: string, nullable: true }
        observable_type_id: { type: integer, nullable: true }
        tags:
          type: array
          items: { type: string }
          nullable: true
        source: { type: string, nullable: true }
        payload: { type: string, nullable: true }
        deliveries:
          type: array
          nullable: true
          description: >-
            One entry per (channel, alert) delivery attempt made by a
            scheduler task of type='notify' that matched this alert against
            a notification_policies channel - null/empty means no channel
            has matched yet. This is a join onto the sibling
            alert_deliveries table, not a column on the alert itself: alerts
            record what fired, not whether/how it was delivered.
          items:
            type: object
            properties:
              channel_id: { type: integer }
              notified_at:
                type: string
                nullable: true
                description: >-
                  Set once this specific channel's send for this alert
                  succeeded. Null means still eligible - the next notify
                  firing retries just this channel.
              status: { type: string, nullable: true, enum: [pending, triggering, sent, error] }
        created_at: { type: string }
    Rule:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        source:
          type: string
          description: The flat rule document this row was parsed from (see CLAUDE.md's Rules section).
        condition_expression: { type: string }
        severity:
          type: string
          enum: [low, medium, high, critical]
          nullable: true
        tags:
          type: array
          items: { type: string }
          nullable: true
        enabled: { type: boolean }
        cooldown_seconds:
          type: integer
          nullable: true
          minimum: 0
          description: >-
            Suppresses creating another alert for the same rule+observable within
            this many seconds of the last one. Null/0 means no cooldown.
    Worker:
      type: object
      properties:
        worker_id: { type: string }
        connection_type:
          type: string
          enum: [http, mqtt, embedded]
        version: { type: string, nullable: true }
        capabilities:
          type: array
          items: { type: string }
          nullable: true
        config: { type: string, nullable: true }
        uptime_seconds: { type: integer, nullable: true }
        roles:
          type: array
          items: { type: string, enum: [analyzer, observer, deliver, scheduler, evaluator] }
          nullable: true
          description: >-
            Fixed, hardcoded roles this worker self-reports - a worker can have more than
            one (e.g. the embedded worker reports both "observer" and "analyzer", since it observes
            and runs rule matching in the same process).
        properties:
          type: object
          additionalProperties: true
          description: >-
            Role-specific self-reported metadata, validated against the combination of every
            declared role's fixed property schema (see
            server/plugins/workers/worker_role_schemas.lua) - e.g. an "analyzer"-role worker
            reports `observations_analyzed`.
        last_seen_at: { type: string }
    Job:
      type: object
      properties:
        id: { type: integer }
        worker_id: { type: string }
        type:
          type: string
          enum: [observe, analyze, notify, deliver, observer_test]
        ref_id:
          type: integer
          description: >-
            Polymorphic per type (not an FK - application code owns its
            integrity). For type='observe', ref_id is usually an observables.id
            (one ordinary per-observable observe, from_scheduler=false) but can
            also be a scheduler_tasks.id (from_scheduler=true): the single
            aggregate job a scheduler task firing queues (see PUT
            /api/scheduler/fire-due/.../claim) has no per-observable job of its
            own, and ref_id there identifies the task, not an observable.
            type='analyze'/'notify'/'deliver' are exclusively scheduler-fired,
            so ref_id is always a scheduler_tasks.id (from_scheduler is always
            true) for those. For type='observer_test', ref_id is an
            observer_config_test_requests.id.
        from_scheduler:
          type: boolean
          description: >-
            True for the single aggregate job a scheduler task firing
            queues (ref_id is then a scheduler_tasks.id, never an observables.id).
            The only type this varies for is 'observe' - 'analyze'/'notify'/
            'deliver' are always true, 'observer_test' is always false. Disambiguates
            ref_id's polymorphism (see above) and drives GET /api/jobs'
            observable_type_id filter.
        status:
          type: string
          enum: [pending, triggering, acknowledged, error]
        message: { type: string, nullable: true }
        action: { type: string, nullable: true }
        result:
          type: object
          nullable: true
          description: >-
            Arbitrary JSON payload a report can carry back - type='observer_test'
            populates this with the observed {ok, data} result; a scheduler
            task's aggregate type='observe'/'analyze' job populates it with
            {succeeded, failed, total, failures, ...}; a type='notify' job
            (the "evaluator" role) populates it with
            {enqueued, alerts_matched} - the evaluator worker's own matching
            pass enqueued that many (alert, channel) pairs onto the
            alert_deliveries queue, this job never carries any
            per-channel send outcome (see PUT /api/alert_deliveries/report
            for where those land instead, reported by the separate
            "deliver" role).
        retries: { type: integer }
        taken_at: { type: string, nullable: true }
        acked_at: { type: string, nullable: true }
        error_at: { type: string, nullable: true }
    SchedulerTask:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        type:
          type: string
          enum: [observe, analyze, notify, deliver]
          description: >-
            What kind of work this task fires. observe/analyze target a set
            of observables (observable_type_id + observable_ids); notify targets a
            notification-policy pass (notify_policy_ids); deliver has no
            target of its own at all - it drains whatever's currently
            pending on the alert_deliveries queue, an alternative to a
            "deliver" worker's own independent alert_deliveries polling
            (see that worker's deliver.source config). Immutable after
            creation.
        observable_type_id:
          type: integer
          nullable: true
          description: Required for observe/analyze; null for notify/deliver.
        observable_ids:
          type: array
          items: { type: integer }
          nullable: true
          description: >-
            observe/analyze only. NULL/empty = wildcard (every enabled observable
            of observable_type_id).
        notify_policy_ids:
          type: array
          items: { type: integer }
          nullable: true
          description: >-
            notify only. NULL/empty = every enabled notification_policies
            row; non-empty = only these specific policy ids.
        schedule_type:
          type: string
          enum: [cron, one_shot]
        cron_expression: { type: string, nullable: true }
        run_at: { type: string, nullable: true }
        enabled: { type: boolean }
        next_run_at: { type: string, nullable: true }
        last_run_at: { type: string, nullable: true }
        created_at: { type: string }
        updated_at: { type: string }
    ObserverConfig:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        observable_type_id: { type: integer }
        enabled: { type: boolean }
        fields:
          type: object
          additionalProperties: true
          description: >-
            Field-extraction map keyed by field name, each value
            `{selector: string[]}` or `{compute: string}` (plus optional
            transform/validate/temporal). Must supply every field the
            observable type's `observer_config_schema` marks required.
        mechanism_config:
          type: object
          additionalProperties: true
          description: >-
            Observer-specific "how to reach the source" values (e.g.
            urls_match, headers, ssl_verify), validated against the
            observable type's `observer_mechanism_schema`.
        created_at: { type: string }
        updated_at: { type: string }
    NotificationPolicy:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        source:
          type: string
          description: >-
            The flat policy document this row was parsed from
            (name/if/channels/description/tags/enabled - the same
            key:value document shape as a Rule's `source`, see CLAUDE.md's
            Rules section and shared/rule_engine/source.lua, reused
            unchanged).
        condition_expression:
          type: string
          description: >-
            The `if` expression, evaluated against an alert's own fields
            (severity/tags/rule_id/observable_id) - not an observation's
            payload. `severity`'s `>`/`<`/`>=`/`<=` rank semantically as
            low < medium < high < critical (not alphabetically); `severity`,
            `rule_id` and `observable_id` also support `in (v1, v2, ...)`.
        channel_ids:
          type: array
          items: { type: integer }
          description: notification_channels ids this policy routes a matching alert to.
        tags:
          type: array
          items: { type: string }
          nullable: true
        enabled: { type: boolean }
        created_at: { type: string }
        updated_at: { type: string }
    AlertDelivery:
      type: object
      description: >-
        One row per (alert, channel) in the durable delivery queue -
        enqueued by the evaluator worker role (see
        shared/watchtower_worker_core/notification_policy_matcher.lua) and
        claimed/sent by the deliver role
        (see plugins/notification_channels/services/delivery_queue.lua).
        Deliberately not columns on Alert itself; alert_id/channel_id
        together are this resource's primary key, so there's no scalar `id`
        field.
      properties:
        alert_id: { type: integer }
        channel_id: { type: integer }
        channel_name: { type: string }
        channel_type: { type: string, enum: [discord, webhook] }
        alert_severity: { type: string, enum: [low, medium, high, critical] }
        rule_name: { type: string, nullable: true }
        status:
          type: string
          enum: [pending, triggering, sent, error]
          description: >-
            pending = enqueued, not yet claimed by a deliver worker; triggering =
            claimed, being sent now; sent = terminal success; error =
            terminal for this attempt only - the next
            evaluator pass resets it back to pending
            for retry.
        worker_id:
          type: string
          nullable: true
          description: The deliver worker_id that last claimed this row, if any.
        taken_at: { type: string, nullable: true }
        notified_at:
          type: string
          nullable: true
          description: Set once this channel's send for this alert succeeded.
        error_message: { type: string, nullable: true }
        updated_at: { type: string }

paths:
  /api/health:
    get:
      tags: [Health]
      summary: Liveness check
      description: |
        Unauthenticated liveness probe for container/orchestrator health checks.
        Always returns 200; DB connectivity failure is reflected in the body
        rather than as an HTTP error status, so the probe itself never flaps.
      security: []
      responses:
        "200":
          description: OK (check `status`/`db.status` in the body for actual health)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok, degraded]
                    description: "\"degraded\" when the DB check failed."
                  db:
                    type: object
                    properties:
                      status:
                        type: string
                        enum: [ok, error]
                      latency_ms:
                        type: number
                        description: Time taken by the DB connectivity check (SELECT 1), in milliseconds.
                  latency_ms:
                    type: number
                    description: Total request handling time, in milliseconds.

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in with username and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  token:
                    type: string
                    description: JWT bearer token, valid 24h, signed HS256.
                  role:
                    type: string
                    description: Display-only - never trusted for enforcement (see GET /api/auth/me).
        "401":
          description: Invalid credentials

  /api/auth/me:
    get:
      tags: [Auth]
      summary: The current caller's identity and live-resolved permissions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  username: { type: string }
                  role: { type: string }
                  permissions:
                    type: array
                    items: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/auth/api_key:
    get:
      tags: [Auth]
      summary: List the caller's own API keys
      parameters:
        - { name: from, in: query, schema: { type: integer } }
        - { name: size, in: query, schema: { type: integer } }
        - { name: search, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, revoked] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { type: object } }
                  total_items: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Auth]
      summary: Create an API key
      description: >-
        `permissions` is clamped (intersected) against the caller's own
        current permissions at creation time, and re-clamped against them
        on every use - narrowing the owner's role narrows an
        already-issued key's effective grants immediately, with no
        re-issuance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string }
                permissions: { type: array, items: { type: string } }
                expires_in_days: { type: number }
      responses:
        "200":
          description: Created - the plaintext key is returned once, never again
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  api_key: { type: string, example: "akey_<32 hex kid>.<64 hex secret>" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/auth/api_key/{kid}:
    put:
      tags: [Auth]
      summary: Rename an API key
      parameters: [{ name: kid, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties: { label: { type: string } }
      responses:
        "200": { description: OK }
    delete:
      tags: [Auth]
      summary: Delete an API key
      parameters: [{ name: kid, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK }

  /api/auth/api_key/{kid}/revoke:
    post:
      tags: [Auth]
      summary: Revoke an API key (keeps the row, blocks further use)
      parameters: [{ name: kid, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK }

  /api/users:
    get:
      tags: [Users]
      summary: List users
      parameters:
        - { name: username, in: query, schema: { type: string } }
        - { name: role_id, in: query, schema: { type: integer } }
        - { name: enabled, in: query, schema: { type: boolean } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/User" } }
                  total_items: { type: integer }
    post:
      tags: [Users]
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, role_id]
              properties:
                username: { type: string }
                password: { type: string, format: password }
                role_id: { type: integer }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string }, item: { $ref: "#/components/schemas/User" } }

  /api/users/{id}:
    put:
      tags: [Users]
      summary: Update a user (never touches the password - see PUT .../password)
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                role_id: { type: integer }
                enabled: { type: boolean }
      responses:
        "200": { description: OK }
    delete:
      tags: [Users]
      summary: Delete a user
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: OK }

  /api/users/{id}/password:
    put:
      tags: [Users]
      summary: Reset a user's password
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties: { password: { type: string, format: password } }
      responses:
        "200": { description: OK }

  /api/roles:
    get:
      tags: [Roles]
      summary: List roles
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Role" } }
                  total_items: { type: integer }
    post:
      tags: [Roles]
      summary: Create a role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                permissions: { type: array, items: { type: string } }
      responses:
        "201": { description: Created }

  /api/roles/{id}:
    put:
      tags: [Roles]
      summary: Update a role - takes effect immediately for every user assigned to it
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                permissions: { type: array, items: { type: string } }
      responses:
        "200": { description: OK }
    delete:
      tags: [Roles]
      summary: Delete a role (fails if any user is still assigned to it)
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: OK }
        "400": { description: Role is still assigned to one or more users }

  /api/observable_types:
    get:
      tags: [ObservableTypes]
      summary: List observable types
      parameters:
        - { name: name, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
        - { name: created_after, in: query, schema: { type: string } }
        - { name: created_before, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ObservableType" } }
                  total_items: { type: integer }
    post:
      tags: [ObservableTypes]
      summary: Create an observable type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                label: { type: string }
                description: { type: string }
                properties: { type: array, items: { $ref: "#/components/schemas/PropertyDefinition" } }
                observation_schema: { type: array, items: { $ref: "#/components/schemas/PropertyDefinition" } }
      responses:
        "201": { description: Created }
        "400": { description: Invalid property/observation_schema definition }
        "409": { description: An observable type with this name already exists }

  /api/observable_types/{id}:
    get:
      tags: [ObservableTypes]
      summary: Get an observable type
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: OK }
        "404": { description: Not found }
    put:
      tags: [ObservableTypes]
      summary: >-
        Update an observable type. Does not retroactively re-validate existing
        observables/observations already using this type - see
        docs/dev/observable-types-storage.md.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: OK }
    delete:
      tags: [ObservableTypes]
      summary: Delete an observable type (fails if any observable still uses it)
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: OK }
        "409": { description: One or more observables still use this observable type }

  /api/observable_types/import:
    post:
      tags: [ObservableTypes]
      summary: >-
        Import observable types from a previously exported JSON file (`items`
        array). A row that fails validation or insertion is skipped and
        reported in `content.errors` (and counted in `content.failed`) rather
        than aborting the whole import.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties: { file: { type: string, format: binary } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  content:
                    type: object
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/ObservableType" } }
                      failed: { type: integer }
                      errors: { $ref: "#/components/schemas/ImportRowErrors" }
        "400": { description: File is missing }
        "500": { description: "File content could not be decoded (body: `{ok: false, error}`)" }

  /api/observables:
    get:
      tags: [Observables]
      summary: List observables
      description: >-
        `observable_type_id` scopes the list to one type, which also unlocks
        per-property filtering via `properties.<name>` (exact/contains
        match), `properties.<name>.gt|.gte|.lt|.lte` (range, number/date
        properties only), and extends `search` to that type's `searchable`
        properties. See docs/dev/observable-types-storage.md.
      parameters:
        - { name: from, in: query, schema: { type: integer } }
        - { name: size, in: query, schema: { type: integer } }
        - { name: enabled, in: query, schema: { type: boolean } }
        - { name: name, in: query, schema: { type: string } }
        - { name: observable_type_id, in: query, schema: { type: integer } }
        - { name: search, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string }, example: "name:asc" }
        - { name: created_after, in: query, schema: { type: string } }
        - { name: created_before, in: query, schema: { type: string } }
        - { name: updated_after, in: query, schema: { type: string } }
        - { name: updated_before, in: query, schema: { type: string } }
        - name: properties.<name>
          in: query
          schema: { type: string }
          description: Dynamic - one per property of the selected observable_type_id. Not a literal param name.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Observable" } }
                  total_items: { type: integer }
    post:
      tags: [Observables]
      summary: Create an observable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [observable_type_id]
              properties:
                name:
                  type: string
                  description: >-
                    Required unless observable_type_id declares a url-typed
                    property and properties includes it, in which case it
                    defaults to a slug derived from that URL.
                observable_type_id: { type: integer }
                enabled: { type: boolean }
                properties:
                  type: object
                  additionalProperties: true
                  description: Validated against observable_type_id's properties schema.
      responses:
        "201": { description: Created }
        "400": { description: properties failed validation against the observable type's schema }
        "404": { description: observable_type_id not found }

  /api/observables/{id}:
    get:
      tags: [Observables]
      summary: Get an observable
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: OK }
        "404": { description: Not found }
    put:
      tags: [Observables]
      summary: Update an observable (observable_type_id is immutable after creation)
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: OK }
    delete:
      tags: [Observables]
      summary: Delete an observable
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: OK }
        "404": { description: Not found }

  /api/observables/export:
    get:
      tags: [Observables]
      summary: Export all observables as a JSON file
      responses:
        "200": { description: OK }

  /api/observables/import:
    post:
      tags: [Observables]
      summary: >-
        Import observables from a previously exported JSON file. A row whose
        properties fail validation against its observable_type_id is skipped
        and counted in the response's `failed` count rather than aborting
        the whole import; each skipped row is described in `content.errors`.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties: { file: { type: string, format: binary } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  content:
                    type: object
                    properties:
                      observables: { type: array, items: { $ref: "#/components/schemas/Observable" } }
                      failed: { type: integer }
                      errors: { $ref: "#/components/schemas/ImportRowErrors" }
        "400": { description: File is missing }
        "500": { description: "File content could not be decoded (body: `{ok: false, error}`)" }

  /api/observations:
    get:
      tags: [Observations]
      summary: List observations
      description: >-
        Same `observable_type_id` / `properties.<name>[.gt|.gte|.lt|.lte]` /
        `search` convention as GET /api/observables, scoped by the owning observable's
        observable type's `observation_schema` instead of `properties`.
      parameters:
        - { name: id, in: query, schema: { type: integer } }
        - { name: observable_id, in: query, schema: { type: integer } }
        - { name: observable_type_id, in: query, schema: { type: integer } }
        - { name: worker, in: query, schema: { type: string } }
        - { name: timestamp_after, in: query, schema: { type: string } }
        - { name: timestamp_before, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string }, description: "e.g. timestamp:desc" }
        - { name: from, in: query, schema: { type: integer } }
        - { name: size, in: query, schema: { type: integer } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Observation" } }
                  total_items: { type: integer }
    post:
      tags: [Observations]
      summary: Ingest an observable-type observation
      description: >-
        Validates the observation's `properties` against the observable type's
        observation_schema and stores it. It deliberately does NOT run rule
        matching (an API route never evaluates rules): alerts for it are
        created asynchronously by whichever "analyzer"-role worker is
        configured, either sweeping every enabled observable or claiming a
        scheduler-fired type='analyze' task, matching each observable's latest
        stored observation (source = the observable's name, payload = its
        stored properties as JSON) against every enabled rule. Any observable
        type's fields are reachable in a rule only via `payload.<name>` - never
        a fixed field name - since an observable type's observation shape is
        arbitrary; `worker` is the one piece of observation metadata exposed
        directly, since it's universal across every observable type. A matching
        rule with a `cooldown_seconds` set is silently skipped (no alert
        created) if it already fired an alert for this same observable within
        that many seconds. A rule's `payload`/`payload.<field>` `changed`/
        `changed_within <duration>` operators (see POST /api/rules) are
        evaluated against the analyzed observation's `observable_id` and
        `timestamp`, looking up the prior observation(s) stored for that
        observable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, timestamp, worker_id]
              properties:
                id: { type: integer, description: observable_id }
                timestamp: { type: string }
                worker_id:
                  type: string
                  description: The reporting worker's id (workers.worker_id), usable directly in rule definitions.
                properties:
                  type: object
                  additionalProperties: true
                  description: Validated against the owning observable's observable_type's observation_schema.
      responses:
        "200": { description: Created }
        "400": { description: properties failed validation against the observable type's observation_schema, or worker_id is missing }
        "404": { description: observable not found }

  /api/observations/{id}:
    delete:
      tags: [Observations]
      summary: Delete an observation
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: OK }
        "404": { description: Not found }

  /api/alerts:
    get:
      tags: [Alerts]
      summary: List fired alerts
      parameters:
        - { name: severity, in: query, schema: { type: string } }
        - { name: rule_id, in: query, schema: { type: string }, description: "An id, 'matched', or 'none'." }
        - { name: observation_id, in: query, schema: { type: integer } }
        - { name: observable_id, in: query, schema: { type: integer } }
        - { name: observable_type_id, in: query, schema: { type: integer } }
        - { name: tags, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
        - { name: created_after, in: query, schema: { type: string } }
        - { name: created_before, in: query, schema: { type: string } }
        - name: needs_delivery
          in: query
          schema: { type: boolean }
          description: >-
            Plain data filter (no matching): only alerts with no alert_deliveries
            row yet, or at least one in status='error' - the candidate set the
            "evaluator" worker role pages through.
        - name: after_id
          in: query
          schema: { type: integer }
          description: >-
            Keyset cursor: only alerts with an id greater than this. Combine with
            `sort=id:asc` to page a set that shrinks while it is being paged
            (needs_delivery), where offset paging (`from`) would skip rows.
        - { name: sort, in: query, schema: { type: string }, description: "e.g. created_at:desc" }
        - { name: from, in: query, schema: { type: integer } }
        - { name: size, in: query, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Alert" } }
                  total_items: { type: integer }
    post:
      tags: [Alerts]
      summary: Create an alert directly
      description: >-
        Requires alerts:create (distinct from alerts:read/delete; the
        built-in admin and operator roles have it, viewer doesn't). A narrow, validating
        create for a caller that already decided a rule matched and already
        made its own cooldown decision - it performs no matching/cooldown
        logic of its own, only checks observation_id references an existing
        observation and severity (if given) is one of the four allowed
        values. Used by the standalone worker's analyzer role
        (shared/watchtower_worker_core/worker_rule_matcher.lua) to create
        alerts from its own client-side rule matching. The embedded worker
        creates alerts in-process instead (shared/analyzer.lua); neither path
        runs as a side effect of POST /api/observations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [observation_id]
              properties:
                observation_id: { type: integer }
                severity: { type: string, enum: [low, medium, high, critical] }
                rule_id: { type: integer, nullable: true }
                tags: { type: array, items: { type: string }, nullable: true }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  item: { $ref: "#/components/schemas/Alert" }
        "400": { description: severity is not one of the allowed values, or a field (e.g. tags) fails validation }
        "404": { description: observation not found }

  /api/alerts/{id}:
    get:
      tags: [Alerts]
      summary: Get a fired alert
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: OK }
        "404": { description: Not found }
    delete:
      tags: [Alerts]
      summary: Delete a fired alert
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: OK }

  /api/rules:
    get:
      tags: [Rules]
      summary: List rules
      parameters:
        - { name: id, in: query, schema: { type: integer } }
        - { name: name, in: query, schema: { type: string } }
        - { name: enabled, in: query, schema: { type: boolean } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Rule" } }
                  total_items: { type: integer }
    post:
      tags: [Rules]
      summary: >-
        Create a rule from its flat source document. `if:` is deliberately agnostic to each
        observable type's own schema - the only fields it can reference directly are
        `source`, `observable_id`, `worker`, `observable_type` (the observable type's own `name`, e.g.
        `observable_type = "product"`) and `payload`; any observable type's own observation fields
        (e.g. "product"'s price/discount/available/url) are reachable only via `payload.<field>`,
        since their names/shapes vary per observable type (see ObservableType.observation_schema).
        Besides `=`/`!=`/`>`/`<`/`>=`/`<=`, `payload`/`payload.<field>` also support: `changed`
        (true if the value differs from the immediately preceding observation) and `changed_within
        <duration>` (same, vs. the value at least `<duration>` ago - a magnitude+unit string, e.g.
        `30s`/`1m`/`2h`/`3d`/`1M`/`500ms`, or bare `0`; there is no dedicated "unchanged" operator -
        use `NOT (payload.price changed)`); `is_set` (true when the field is present, e.g.
        `NOT (payload.discount_code is_set)` for "absent"); `contains` (plain, case-insensitive
        substring search - not a regex, to avoid a ReDoS surface on a hot ingestion path); `in
        (v1, v2, ...)` (shorthand for repeated `= OR =`, valid wherever `=` is except `tags`, which
        already has `has`); `dropped_pct <percent> within <duration>` / `raised_pct` (true when a
        numeric field fell/rose by at least that percent vs. its value at least `<duration>` ago,
        e.g. `payload.price dropped_pct 10 within 24h`); and `older_than <duration>` / `newer_than`
        (compares a `date`-typed field, an ISO 8601 string, against `now - <duration>` - an absolute
        literal comparison like `payload.published_at > "2026-01-01"` already works via `>`/`<`
        directly, these two only add the "relative to now" case). `severity` (notification-policy
        `if:` only - rules never see it) ranks `>`/`<`/`>=`/`<=` semantically as
        low < medium < high < critical, not alphabetically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source]
              properties:
                source:
                  type: string
                  example: |
                    name: cheap-gpu
                    if: payload.price < 300 AND worker = "worker-lua"
                    severity: high
      responses:
        "201": { description: Created }
        "400": { description: Invalid rule source or condition expression }

  /api/rules/{id}:
    get:
      tags: [Rules]
      summary: Get a rule
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: OK }
    put:
      tags: [Rules]
      summary: Update a rule
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [source]
              properties: { source: { type: string } }
      responses:
        "200": { description: OK }
    delete:
      tags: [Rules]
      summary: Delete a rule
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: OK }

  /api/rules/export:
    get:
      tags: [Rules]
      summary: >-
        Download matching rules (all, or `?ids=1,2,3`) as a file - a single
        `.yaml` for exactly one matching rule, or a `.zip` of one `.yaml`
        per rule for 2+. The response body is the raw file, not JSON.
      parameters:
        - { name: ids, in: query, schema: { type: string }, description: "Comma-separated rule ids. Omit to export every rule." }
      responses:
        "200":
          description: OK
          content:
            text/yaml: { schema: { type: string, format: binary } }
            application/zip: { schema: { type: string, format: binary } }
        "400": { description: "`ids` is not a comma-separated list of numeric ids" }
        "404": { description: No rules matched }

  /api/rules/import/preflight:
    post:
      tags: [Rules]
      summary: >-
        Parses and validates an uploaded rule file or zip of rule files
        without saving anything. A zip is detected by its magic bytes, not
        the filename/extension. Each candidate is validated the same way
        POST/PUT /api/rules validates `source`; a name collision with an
        existing rule is reported as `conflict` for the caller to resolve
        before calling POST /api/rules/import.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties: { file: { type: string, format: binary } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        file: { type: string }
                        name: { type: string }
                        source: { type: string }
                        error: { type: string, description: Set instead of name/source if this candidate failed validation. }
                        conflict:
                          type: object
                          nullable: true
                          properties: { id: { type: integer }, name: { type: string } }
        "400": { description: File missing, or the upload isn't a valid zip }

  /api/rules/import:
    post:
      tags: [Rules]
      summary: >-
        Commits a client-resolved decision array from a prior preflight.
        Each item is processed independently (one bad item doesn't abort
        the rest) via the same validation as POST/PUT /api/rules.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [source, action]
                    properties:
                      source: { type: string }
                      action: { type: string, enum: [create, update] }
                      existing_id: { type: integer, description: Required when action is "update". }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        ok: { type: boolean }
                        error: { type: string, nullable: true }

  /api/rules/test:
    post:
      tags: [Rules]
      summary: >-
        Match a sample observation against every enabled rule (nothing is persisted).
        `changed`/`changed_within <duration>`/`dropped_pct`/`raised_pct` only evaluate
        meaningfully when a real `observable_id` with stored observation history is
        supplied; otherwise they deterministically evaluate to `false`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                source: { type: string }
                payload: { type: string }
                observable_id: { type: integer }
                worker: { type: string }
                observable_type: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  matches:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        severity: { type: string, nullable: true }
                        tags: { type: array, items: { type: string }, nullable: true }

  /api/rules/test-expression:
    post:
      tags: [Rules]
      summary: >-
        Evaluate an ad-hoc `if:` expression against a sample observation (nothing is persisted,
        no rule needs to exist). `changed`/`changed_within <duration>`/`dropped_pct`/
        `raised_pct` only evaluate meaningfully when a real `observable_id` with stored
        observation history is supplied; otherwise they deterministically evaluate to `false`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: ["if"]
              properties:
                if: { type: string }
                source: { type: string }
                payload: { type: string }
                observable_id: { type: integer }
                worker: { type: string }
                observable_type: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { matched: { type: boolean } }
        "400": { description: Invalid expression }

  /api/workers:
    get:
      tags: [Workers]
      summary: List registered workers
      parameters:
        - name: role
          in: query
          schema: { type: string, enum: [analyzer, observer, deliver, scheduler, evaluator] }
          description: Filter to workers that declared this role in their last heartbeat's `roles`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Worker" } }

  /api/workers/export:
    get:
      tags: [Workers]
      summary: Download every worker matching the current filters/search/sort (unpaginated) as JSON or CSV
      description: >-
        Accepts the same filter/search/sort query params as `GET /api/workers`
        (including `role`), but returns every match instead of one page.
        Requires `workers:read`.
      parameters:
        - name: role
          in: query
          schema: { type: string, enum: [analyzer, observer, deliver, scheduler, evaluator] }
          description: Filter to workers that declared this role in their last heartbeat's `roles`.
        - { name: format, in: query, schema: { type: string, enum: [json, csv], default: json }, description: "`csv` returns a CSV file; anything else returns JSON." }
      responses:
        "200":
          description: >-
            A file download (`Content-Disposition: attachment; filename="workers_export_<date>.json|.csv"`).
            CSV columns are worker_id, connection_type, version, capabilities, config,
            uptime_seconds, roles, properties, last_seen_at, created_at, updated_at.
          content:
            application/json:
              schema:
                type: object
                properties:
                  description: { type: string, example: Workers }
                  items: { type: array, items: { $ref: "#/components/schemas/Worker" } }
            text/csv: { schema: { type: string } }

  /api/workers/{id}:
    get:
      tags: [Workers]
      summary: Get a worker
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK }
        "404": { description: Not found }
    delete:
      tags: [Workers]
      summary: Delete a worker
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK }
        "404": { description: Not found }

  /api/workers/{id}/heartbeat:
    put:
      tags: [Workers]
      summary: Self-register/refresh a worker's identity, roles, and health
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [connection_type, roles]
              properties:
                connection_type: { type: string, enum: [http, mqtt, embedded] }
                version: { type: string }
                capabilities: { type: array, items: { type: string } }
                uptime_seconds: { type: number }
                config: { type: string }
                roles:
                  type: array
                  items: { type: string, enum: [analyzer, observer, deliver, scheduler, evaluator] }
                  description: At least one fixed role this worker performs.
                properties:
                  type: object
                  additionalProperties: true
                  description: >-
                    Validated against the combined property schema of every role in `roles` (see
                    the Worker schema) - an unknown key, or a key belonging to a role not
                    declared in `roles`, is rejected.
      responses:
        "202": { description: Heartbeat recorded }
        "400": { description: Unknown worker role, or properties failed validation against the declared roles' schemas }

  /api/workers/{id}/events:
    get:
      tags: [Workers]
      summary: Long-poll for a realtime "go claim now" wake signal (latency optimization only)
      description: >-
        Holds the request open (server-side, polling its wake counters every 0.2s) until
        any requested key's counter exceeds its `since` value, or the wait cap elapses.
        Carries no payload beyond `{key, seq}`; the caller still claims through its own
        endpoint. It evaluates and decides nothing, and normal polling remains the
        fallback. Requires `workers:write`, same as heartbeat. See
        docs/dev/worker-configuration.md's "Realtime wake events" section.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: keys, in: query, required: true, schema: { type: string }, description: "Comma-separated wake keys, each one of `observe`, `analyze`, `notify`, `deliver`, `observer_test`." }
        - { name: since, in: query, schema: { type: string }, description: "Comma-separated `key:seq` pairs the caller already knows (e.g. `observe:12,deliver:3`). A key not listed counts as 0." }
        - { name: wait, in: query, schema: { type: number, default: 25, minimum: 0, maximum: 25 }, description: "Seconds to hold the request open; clamped to 0-25, 25 is also the default. 0 (or negative) is a single non-blocking check." }
      responses:
        "200":
          description: A requested key's counter moved past its `since` value (the first such key found).
          content:
            application/json:
              schema:
                type: object
                properties:
                  key: { type: string, enum: [observe, analyze, notify, deliver, observer_test] }
                  seq: { type: integer }
        "204": { description: No change within the wait window (empty body) }
        "400": { description: "`keys` missing/empty, or contains an unknown wake key" }

  /api/workers/{id}/heartbeats:
    get:
      tags: [Workers]
      summary: Bucketed heartbeat history, for a connectivity histogram
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: bucket, in: query, required: true, schema: { type: string, enum: [minute, hour, day] } }
        - { name: since, in: query, required: true, schema: { type: string } }
        - { name: until, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties: { bucket: { type: string }, count: { type: integer } }

  /api/workers/embedded/run/{role}:
    post:
      tags: [Workers]
      summary: Trigger a single out-of-band pass of the embedded worker's given role
      description: >-
        The embedded worker's closest equivalent to the standalone worker's
        --once/WORKER_RUN_ONCE (see worker/lua/main.lua and
        docs/dev/worker-configuration.md's "Running as a one-shot job"
        section) - it can't itself be invoked by an external OS cron/systemd
        timer since it lives inside the server's nginx worker process rather
        than being its own process, but an admin, or an external cron
        curling this route, can force one immediate pass of a given role's
        action ahead of that role's own polling cadence. Runs synchronously
        and returns once dispatched - it doesn't itself report whether the
        underlying claim found/sent anything, check jobs/alert_deliveries or
        the server logs for that, same as the role's own periodic tick.
        404s if the embedded worker isn't running on this server
        (USE_EMBED_WORKER=0), 400s for an unrecognized role or a role this
        worker doesn't currently declare (e.g. "deliver" without
        USE_EMBED_DELIVER=1).
      parameters:
        - name: role
          in: path
          required: true
          schema: { type: string, enum: [observer, analyzer, evaluator, deliver, scheduler] }
      responses:
        "202": { description: Role triggered }
        "400": { description: Unknown or undeclared role }
        "404": { description: Embedded worker is not running on this server }

  /api/scheduler:
    get:
      tags: [Scheduler]
      summary: List scheduler tasks
      parameters:
        - { name: type, in: query, schema: { type: string, enum: [observe, analyze, notify, deliver] } }
        - { name: observable_type_id, in: query, schema: { type: integer } }
        - { name: schedule_type, in: query, schema: { type: string, enum: [cron, one_shot] } }
        - { name: enabled, in: query, schema: { type: string, enum: [true, false] } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/SchedulerTask" } }
                  total_items: { type: integer }
    post:
      tags: [Scheduler]
      summary: Create a scheduler task
      description: >-
        `next_run_at` is computed server-side from the schedule fields.
        `type` defaults to `observe` and is immutable after creation. For
        `observe`/`analyze`, `observable_type_id` is required and `observable_ids`
        omitted/empty means every enabled observable of `observable_type_id`
        (resolved fresh at each firing). For `notify`, `observable_type_id`/
        `observable_ids` are rejected and `notify_policy_ids` omitted/empty means
        every enabled notification policy. `deliver` accepts neither
        `observable_type_id`/`observable_ids` nor `notify_policy_ids` - it has
        no target of its own, it just drains whatever's pending on the
        alert_deliveries queue (see that worker role's deliver.source
        config). `run_at` omitted on a one_shot task means "run as soon as
        possible" (server defaults it to NOW()). `run_now: true` forces
        `next_run_at` to NOW() regardless of schedule_type, without altering
        `cron_expression`/`run_at` - a cron task fires once immediately and
        then resumes its normal cadence. `run_now: true` also forces
        `enabled` to true (re-arming a disabled or already-fired one-shot
        task); combining it with `enabled: false` is rejected with 400.
        `run_now` is not persisted and
        never appears in the response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, schedule_type]
              properties:
                name: { type: string }
                type: { type: string, enum: [observe, analyze, notify, deliver], default: observe }
                observable_type_id: { type: integer, description: "Required for observe/analyze." }
                observable_ids: { type: array, items: { type: integer } }
                notify_policy_ids: { type: array, items: { type: integer } }
                schedule_type: { type: string, enum: [cron, one_shot] }
                cron_expression: { type: string }
                run_at: { type: string }
                enabled: { type: boolean }
                run_now: { type: boolean }
      responses:
        "201": { description: Created }
        "400": { description: Invalid cron expression, observable_ids not belonging to observable_type_id, unknown notify_policy_ids, etc. }

  /api/scheduler/export:
    get:
      tags: [Scheduler]
      summary: Export every scheduler task as a JSON download
      description: >-
        Requires `scheduler:read`. Returns `{description, items}` with a
        `Content-Disposition: attachment` header
        (`scheduler_tasks_export_<date>.json`). The file is accepted as-is
        by POST /api/scheduler/import.
      responses:
        "200":
          description: OK
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  description: { type: string }
                  items: { type: array, items: { $ref: "#/components/schemas/SchedulerTask" } }

  /api/scheduler/import:
    post:
      tags: [Scheduler]
      summary: Import scheduler tasks from a previously exported JSON file
      description: >-
        Requires `scheduler:create`. Each item is validated like a
        POST /api/scheduler create (id, next_run_at, last_run_at and
        timestamps in an exported row are ignored); an item that fails
        validation is skipped and counted in `content.failed` rather than
        aborting the whole import.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties: { file: { type: string, format: binary } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  content:
                    type: object
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/SchedulerTask" } }
                      failed: { type: integer }
        "400": { description: File is missing }
        "500": { description: File content could not be decoded }

  /api/scheduler/{id}:
    get:
      tags: [Scheduler]
      summary: Get a scheduler task
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: OK }
        "404": { description: Not found }
    put:
      tags: [Scheduler]
      summary: Update a scheduler task
      description: >-
        `type`/`observable_type_id` are immutable after creation - not
        accepted here even if present in the body. `run_now: true` forces
        `next_run_at` to NOW() regardless of schedule_type, without altering
        `cron_expression`/`run_at` - a cron task fires once immediately and
        then resumes its normal cadence. `run_now: true` also forces
        `enabled` to true (re-arming a disabled or already-fired one-shot
        task); combining it with `enabled: false` is rejected with 400.
        `run_now` is not persisted and
        never appears in the response.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                observable_ids: { type: array, items: { type: integer } }
                notify_policy_ids: { type: array, items: { type: integer } }
                schedule_type: { type: string, enum: [cron, one_shot] }
                cron_expression: { type: string }
                run_at: { type: string }
                enabled: { type: boolean }
                run_now: { type: boolean }
      responses:
        "200": { description: OK }
        "400": { description: Invalid input }
    delete:
      tags: [Scheduler]
      summary: Delete a scheduler task
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: Deleted }

  /api/scheduler/preview-cron:
    post:
      tags: [Scheduler]
      summary: Evaluate a draft cron expression without saving anything
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cron_expression]
              properties:
                cron_expression: { type: string }
                count: { type: integer, description: "Up to 20, default 5." }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  next_runs: { type: array, items: { type: string } }
        "400": { description: Invalid cron expression }

  /api/scheduler/fire-due:
    put:
      tags: [Scheduler]
      summary: Worker-facing "scheduler" role tick
      description: >-
        Evaluates every due scheduler_tasks row (enabled, next_run_at <=
        NOW()) and queues a single pending `jobs` row per firing (type=the
        task's own type, ref_id=the scheduler_tasks id, from_scheduler=true
        - reusing an existing unclaimed one for the same task if present),
        then advances next_run_at (cron) or disables (one_shot). Does not
        resolve or depend on the task's target (observable set, or notify
        dispatch plan) - that's resolved lazily by whichever worker claims
        the job (see PUT /api/scheduler/claim). Called by a standalone
        worker's own scheduler tick; the embedded worker calls the
        underlying service directly instead.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  fired: { type: integer }

  /api/scheduler/claim:
    put:
      tags: [Scheduler]
      summary: Worker-facing role priority pickup (observe/analyze/notify/deliver)
      description: >-
        Atomically claims the single oldest pending `jobs` row of `type`
        queued by a scheduler task firing (if any), ahead of the normal
        stalest-observable polling (for type=observe). Same lax, no-locking model
        already used for observe/test jobs. The claimed job's target is
        resolved fresh at claim time - `observables` for observe/analyze (so
        the worker can process the whole batch without a
        GET /api/observables/:id round trip per observable, returned in
        full); for notify, only the task's policy scope
        (`notify_policy_ids`, absent = every enabled policy) - claiming
        evaluates nothing, since an API route never evaluates: the
        "evaluator" worker role matches unnotified
        alerts against notification_policies and enqueues the result onto the
        alert_deliveries queue itself, in its own process (it never sends
        anything - see PUT /api/alert_deliveries/claim for that role); for deliver,
        claiming forwards straight to PUT /api/alert_deliveries/claim's own
        claim_batch internally and returns its `groups` unchanged - an
        alternative entry point onto that queue for the "deliver" role
        (its own deliver.source config picks between claiming here or
        calling PUT /api/alert_deliveries/claim directly, see that route).
        The claiming worker must report exactly one final status back on
        this same job (PUT /api/jobs/<type>/:task_id/ack or .../error, with
        skip_rollup=true - see the Job schema's ref_id note) once the whole
        target has been attempted (for notify, after its own matching pass),
        rather than a job per
        observable/channel - for deliver, in addition to that job report,
        the worker also reports each individual delivery's own outcome via
        PUT /api/alert_deliveries/report, exactly as it would for a direct
        alert_deliveries claim.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worker_id, type]
              properties:
                worker_id: { type: string }
                type: { type: string, enum: [observe, analyze, notify, deliver] }
      responses:
        "200":
          description: OK (an empty/null item means nothing is pending)
          content:
            application/json:
              schema:
                type: object
                properties:
                  item:
                    type: object
                    nullable: true
                    properties:
                      job_id: { type: integer }
                      task_id: { type: integer, description: the scheduler_tasks id this job belongs to }
                      type: { type: string, enum: [observe, analyze, notify, deliver] }
                      observables:
                        type: array
                        items: { $ref: "#/components/schemas/Observable" }
                        description: observe/analyze only.
                      notify_policy_ids:
                        type: array
                        items: { type: integer }
                        description: >-
                          notify only - the task's policy scope; omitted when
                          the task targets every enabled policy.
                      groups:
                        type: array
                        description: >-
                          deliver only - a batch of pending alert_deliveries
                          rows grouped by channel, same shape
                          PUT /api/alert_deliveries/claim's own `item.groups`
                          returns.
                        items:
                          type: object
                          properties:
                            channel:
                              type: object
                              description: "A notification_channels row, e.g. {id, type, name, options}."
                            alerts: { type: array, items: { $ref: "#/components/schemas/Alert" } }
                            alert_ids: { type: array, items: { type: integer } }

  /api/jobs:
    get:
      tags: [Jobs]
      summary: List jobs
      parameters:
        - { name: worker_id, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string, enum: [observe, analyze, notify, deliver, observer_test] } }
        - { name: status, in: query, schema: { type: string } }
        - { name: ref_id, in: query, schema: { type: integer } }
        - name: observable_type_id
          in: query
          schema: { type: integer }
          description: >-
            Resolves the polymorphic ref_id through scheduler_tasks
            (from_scheduler=true rows) or observables (from_scheduler=false rows)
            depending on each row's own from_scheduler flag.
        - { name: search, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Job" } }
                  total_items: { type: integer }

  /api/jobs/stats:
    get:
      tags: [Jobs]
      summary: Per-worker job totals + a breakdown by status
      parameters: [{ name: type, in: query, schema: { type: string, enum: [observe, analyze, notify, deliver, observer_test] } }]
      responses:
        "200": { description: OK }

  /api/jobs/{id}:
    get:
      tags: [Jobs]
      summary: Get a job
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: OK }
    delete:
      tags: [Jobs]
      summary: Delete a job
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: OK }

  /api/jobs/for/{type}/{ref_id}:
    get:
      tags: [Jobs]
      summary: List every job reported for one (type, ref) pair, across all workers
      parameters:
        - { name: type, in: path, required: true, schema: { type: string } }
        - { name: ref_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: OK }

  /api/jobs/{type}/{ref_id}/{status}:
    put:
      tags: [Jobs]
      summary: Worker-facing status report (lazily creates the job on its first report)
      description: >-
        `status` is `triggering` or `ack`, mapped server-side to the DB's
        `triggering`/`acknowledged` values. Upserted by
        (worker_id, type, ref_id) - see CLAUDE.md's Jobs section for the
        retry/rollup semantics. For type='observer_test', ref_id is an
        observer_config_test_requests id (see
        /api/observer_configs/test_requests/pending) and `result`
        carries the observed {ok, data} back on ack. A scheduler task's
        single aggregate job (see PUT /api/scheduler/claim) also reports
        here with type='observe' and ref_id=the scheduler_tasks id, always
        with skip_rollup=true.
      parameters:
        - { name: type, in: path, required: true, schema: { type: string } }
        - { name: ref_id, in: path, required: true, schema: { type: integer } }
        - { name: status, in: path, required: true, schema: { type: string, enum: [triggering, ack] } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [worker_id]
              properties:
                worker_id: { type: string }
                action: { type: string }
                message: { type: string }
                result: { type: object }
                skip_rollup:
                  type: boolean
                  description: >-
                    Skips writing this report onto its type's rollup target
                    (e.g. observables.last_observe_* for type='observe') - required
                    when ref_id doesn't actually identify that target, as is
                    the case for a scheduler task's aggregate job (ref_id is
                    a scheduler_tasks id there, not an observables id). Every
                    ordinary per-observable report omits this.
      responses:
        "202": { description: Status changed }

  /api/jobs/{type}/{ref_id}/error:
    put:
      tags: [Jobs]
      summary: Worker-facing error report
      parameters:
        - { name: type, in: path, required: true, schema: { type: string } }
        - { name: ref_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [worker_id]
              properties:
                worker_id: { type: string }
                message: { type: string }
                skip_rollup: { type: boolean, description: "See the sibling :status route's skip_rollup." }
      responses:
        "202": { description: Error recorded }

  /api/jobs/reap-stale:
    put:
      tags: [Jobs]
      summary: Worker-facing housekeeping - reset stale in-flight jobs to error
      description: >-
        Requires `jobs:update`. Resets any job stuck in `triggering` (claimed
        but never reported on) for longer than `timeout_seconds` back to
        `error`, with `message` set and `retries` incremented - a claim whose
        worker crashed, hung or lost connectivity would otherwise sit in
        `triggering` forever and permanently block any future claim for that
        same (worker_id, type, ref_id). The observable rollup is re-run for
        every reaped row that isn't scheduler-fired (`from_scheduler=true`
        rows are skipped, since their `ref_id` is a scheduler_tasks id). Run
        periodically by "scheduler"-role workers; its alert_deliveries
        counterpart is PUT /api/alert_deliveries/reap-stale.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                timeout_seconds: { type: integer, minimum: 1, nullable: true, description: "Default 300." }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  reaped: { type: integer }
                  items: { type: array, items: { $ref: "#/components/schemas/Job" } }
        "400": { description: "`timeout_seconds` is not a positive integer" }

  /api/notification_channels:
    get:
      tags: [NotificationChannels]
      summary: List notification channels
      responses:
        "200": { description: OK }
    post:
      tags: [NotificationChannels]
      summary: Create a notification channel (discord or webhook)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [type, name, options]
              properties:
                type: { type: string, enum: [discord, webhook] }
                name: { type: string }
                options: { type: object }
      responses:
        "200": { description: Created }

  /api/notification_channels/export:
    get:
      tags: [NotificationChannels]
      summary: Export every notification channel as a JSON download
      description: >-
        Requires `channels:read`. Returns `{description, items}` with a
        `Content-Disposition: attachment` header
        (`notification_channels_export_<date>.json`). The file is accepted
        as-is by POST /api/notification_channels/import.
      responses:
        "200":
          description: OK
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  description: { type: string }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        type: { type: string, enum: [discord, webhook] }
                        options: { type: object }

  /api/notification_channels/import:
    post:
      tags: [NotificationChannels]
      summary: Import notification channels from a previously exported JSON file
      description: >-
        Requires `channels:create`. An item without `options`, or one whose
        creation fails, is skipped and counted in `content.failed` rather
        than aborting the whole import.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties: { file: { type: string, format: binary } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  content:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            name: { type: string }
                            type: { type: string, enum: [discord, webhook] }
                            options: { type: object }
                      failed: { type: integer }
        "400": { description: File is missing }
        "500": { description: File content could not be decoded }

  /api/notification_channels/{id}:
    get:
      tags: [NotificationChannels]
      summary: Get a notification channel
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: OK }
    put:
      tags: [NotificationChannels]
      summary: Update a notification channel
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: OK }
        "400": { description: Invalid request, or `type` differs from the channel's existing type (type is immutable after creation) }
    delete:
      tags: [NotificationChannels]
      summary: Delete a notification channel
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: OK }

  /api/notification_policies:
    get:
      tags: [NotificationPolicies]
      summary: List notification policies
      parameters:
        - { name: name, in: query, schema: { type: string } }
        - { name: enabled, in: query, schema: { type: string, enum: [true, false] } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/NotificationPolicy" } }
                  total_items: { type: integer }
    post:
      tags: [NotificationPolicies]
      summary: Create a notification policy
      description: >-
        Authored the same flat key:value `source` document a Rule is (see
        CLAUDE.md's Rules section) - `name`/`if`/`channels` required,
        `description`/`tags`/`enabled` optional. `channels` is a
        comma-separated list of notification_channels ids, every one of
        which must already exist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source]
              properties:
                source: { type: string }
      responses:
        "201": { description: Created }
        "400": { description: Invalid source, unknown field, invalid 'if' expression, or unknown channel id }

  /api/notification_policies/{id}:
    get:
      tags: [NotificationPolicies]
      summary: Get a notification policy
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: OK }
        "404": { description: Not found }
    put:
      tags: [NotificationPolicies]
      summary: Update a notification policy
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source]
              properties:
                source: { type: string }
      responses:
        "200": { description: OK }
        "400": { description: Invalid input }
    delete:
      tags: [NotificationPolicies]
      summary: Delete a notification policy
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: OK }

  /api/notification_policies/export:
    get:
      tags: [NotificationPolicies]
      summary: >-
        Download matching notification policies (all, or `?ids=1,2,3`) as a
        file - a single `.yaml` for exactly one matching policy, or a `.zip`
        of one `.yaml` per policy for 2+. The response body is the raw file,
        not JSON. Requires `policies:read`.
      parameters:
        - { name: ids, in: query, schema: { type: string }, description: "Comma-separated policy ids. Omit to export every policy." }
      responses:
        "200":
          description: OK
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            text/yaml: { schema: { type: string, format: binary } }
            application/zip: { schema: { type: string, format: binary } }
        "400": { description: "`ids` is not a comma-separated list of numeric ids" }
        "404": { description: No notification policies matched }

  /api/notification_policies/import/preflight:
    post:
      tags: [NotificationPolicies]
      summary: >-
        Parses and validates an uploaded policy file or zip of policy files
        without saving anything. Requires `policies:create`. A zip is
        detected by its magic bytes, not the filename/extension. Each
        candidate is validated the same way POST/PUT
        /api/notification_policies validates `source`; a name collision with
        an existing policy is reported as `conflict` for the caller to
        resolve before calling POST /api/notification_policies/import.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties: { file: { type: string, format: binary } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        file: { type: string }
                        name: { type: string }
                        source: { type: string }
                        error: { type: string, description: Set instead of name/source if this candidate failed validation. }
                        conflict:
                          type: object
                          nullable: true
                          properties: { id: { type: integer }, name: { type: string } }
        "400": { description: File missing, or the upload isn't a valid zip }

  /api/notification_policies/import:
    post:
      tags: [NotificationPolicies]
      summary: >-
        Commits a client-resolved decision array from a prior preflight.
        Requires both `policies:create` and `policies:update`, since one
        batch can do either. Each item is processed independently (one bad
        item doesn't abort the rest) via the same validation as POST/PUT
        /api/notification_policies.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [source, action]
                    properties:
                      source: { type: string }
                      action: { type: string, enum: [create, update] }
                      existing_id: { type: integer, description: Required when action is "update". }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        ok: { type: boolean }
                        error: { type: string, nullable: true }
        "400": { description: "`items` is not an array" }

  /api/notification_policies/test:
    post:
      tags: [NotificationPolicies]
      summary: Evaluate a draft `if:` expression against a sample alert-like payload, without saving anything
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ["if"]
              properties:
                if: { type: string }
                severity: { type: string, enum: [low, medium, high, critical] }
                tags: { type: array, items: { type: string } }
                rule_id: { type: integer }
                observable_id: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  matched: { type: boolean }
        "400": { description: Invalid expression }

  /api/alert_deliveries:
    get:
      tags: [NotificationChannels]
      summary: List notification deliveries (the durable delivery queue)
      description: >-
        Flat, filterable/sortable/paginated view over the per-(alert,
        channel) delivery queue the notify pipeline produces (see
        CLAUDE.md's plugins/scheduler/ and plugins/notification_channels/
        sections) - the same rows also surfaced nested per-alert as
        Alert.deliveries.
      parameters:
        - { name: channel_id, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string, enum: [pending, triggering, sent, error] } }
        - { name: search, in: query, schema: { type: string }, description: Matches the channel's name or worker_id. }
        - { name: notified_after, in: query, schema: { type: string } }
        - { name: notified_before, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AlertDelivery" } }
                  total_items: { type: integer }

  /api/alert_deliveries/claim:
    put:
      tags: [NotificationChannels]
      summary: Worker-facing "deliver" role priority pickup
      description: >-
        Atomically claims up to `limit` 'pending' alert_deliveries rows
        (oldest first), advancing them to 'triggering' and resolving each
        claimed (alert, channel) pair's full alert/channel data, grouped by
        channel - fully independent of scheduler_tasks/jobs, unlike
        PUT /api/scheduler/claim. Uses FOR UPDATE SKIP LOCKED, so more than
        one "deliver" worker can safely drain this queue concurrently
        without claiming the same row twice. The claiming worker must
        report every claimed row's own outcome back via
        PUT /api/alert_deliveries/report. A "deliver" worker's own
        deliver.source config picks whether it calls this route directly
        (the default) or instead claims a scheduler_tasks type='deliver' job
        via PUT /api/scheduler/claim, whose 'deliver' branch calls this same
        claim internally - see that route's own description.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worker_id]
              properties:
                worker_id: { type: string }
                limit: { type: integer, description: "Default 200." }
      responses:
        "200":
          description: OK (an empty/null item means nothing is pending)
          content:
            application/json:
              schema:
                type: object
                properties:
                  item:
                    type: object
                    nullable: true
                    properties:
                      groups:
                        type: array
                        description: One entry per channel a claimed row routes to.
                        items:
                          type: object
                          properties:
                            channel:
                              type: object
                              description: "A notification_channels row, e.g. {id, type, name, options}."
                            alerts: { type: array, items: { $ref: "#/components/schemas/Alert" } }
                            alert_ids: { type: array, items: { type: integer } }

  /api/alert_deliveries/report:
    put:
      tags: [NotificationChannels]
      summary: Worker-facing "deliver" role outcome report
      description: >-
        Applies each entry in `channel_results` directly onto its own
        (alert_id, channel_id) alert_deliveries row - status becomes 'sent'
        (with notified_at set) or 'error' (with error_message set) -
        guarded on that row still being 'triggering' and claimed by this
        same worker_id, so a report can only resolve a row this worker
        actually claimed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worker_id, channel_results]
              properties:
                worker_id: { type: string }
                channel_results:
                  type: array
                  items:
                    type: object
                    properties:
                      channel_id: { type: integer }
                      alert_id: { type: integer }
                      ok: { type: boolean }
                      reason: { type: string, nullable: true }
      responses:
        "200": { description: OK }

  /api/alert_deliveries/reap-stale:
    put:
      tags: [NotificationChannels]
      summary: Worker-facing "evaluator" role stale-delivery housekeeping
      description: >-
        Resets any alert_deliveries row stuck in 'triggering' past
        timeout_seconds back to 'error' (with error_message set) - a claim
        (PUT /api/alert_deliveries/claim) whose "deliver"-role worker
        crashed/hung/lost connectivity before reporting would otherwise sit
        in 'triggering' forever, never sent and never retried. The
        "evaluator" role runs this (not "deliver") for the same reason
        "scheduler" - not "observer"/"analyzer" - reaps stale jobs (see
        PUT /api/jobs/reap-stale): it's the role that produces this queue's
        rows in the first place.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                timeout_seconds: { type: integer, nullable: true, description: "Default 300." }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  reaped: { type: integer }
                  items: { type: array, items: { $ref: "#/components/schemas/AlertDelivery" } }


  /api/observer_configs:
    get:
      tags: [ObserverConfigs]
      summary: List observer configs
      description: Requires `observer_configs:read`.
      parameters:
        - { name: from, in: query, schema: { type: integer } }
        - { name: size, in: query, schema: { type: integer } }
        - { name: enabled, in: query, schema: { type: string, enum: [true, false] } }
        - { name: observable_type_id, in: query, schema: { type: integer } }
        - { name: id, in: query, schema: { type: integer } }
        - { name: name, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string }, description: "Matches `name`." }
        - { name: sort, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ObserverConfig" } }
                  total_items: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [ObserverConfigs]
      summary: Create an observer config
      description: >-
        Requires `observer_configs:create`. `fields` and `mechanism_config`
        are validated against the target observable type's
        `observer_config_schema`/`observer_mechanism_schema`. `enabled`
        defaults to true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, observable_type_id, fields, mechanism_config]
              properties:
                name: { type: string }
                observable_type_id: { type: integer }
                fields: { type: object, additionalProperties: true }
                mechanism_config: { type: object, additionalProperties: true }
                enabled: { type: boolean, default: true }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  item: { $ref: "#/components/schemas/ObserverConfig" }
        "400": { description: Unknown observable_type_id, or fields/mechanism_config failed validation }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { description: Database error while inserting }

  /api/observer_configs/{id}:
    put:
      tags: [ObserverConfigs]
      summary: Update an observer config
      description: >-
        Requires `observer_configs:update`. Full replacement of the
        validated fields - the body has the same shape as create, and
        `observable_type_id` is required (and may be changed).
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, observable_type_id, fields, mechanism_config]
              properties:
                name: { type: string }
                observable_type_id: { type: integer }
                fields: { type: object, additionalProperties: true }
                mechanism_config: { type: object, additionalProperties: true }
                enabled: { type: boolean, default: true }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  item: { $ref: "#/components/schemas/ObserverConfig" }
        "400": { description: Invalid id, unknown observable_type_id, or fields/mechanism_config failed validation }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Not found }
    delete:
      tags: [ObserverConfigs]
      summary: Delete an observer config
      description: Requires `observer_configs:delete`.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Not found }

  /api/observer_configs/export:
    get:
      tags: [ObserverConfigs]
      summary: Export every observer config as a JSON download
      description: >-
        Requires `observer_configs:read`. Returns
        `{description, items}` with a `Content-Disposition: attachment`
        header (`observer_configs_export_<date>.json`), ordered by name.
        The file is accepted as-is by POST /api/observer_configs/import.
      responses:
        "200":
          description: OK
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  description: { type: string }
                  items: { type: array, items: { $ref: "#/components/schemas/ObserverConfig" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/observer_configs/import:
    post:
      tags: [ObserverConfigs]
      summary: Import observer configs from a previously exported JSON file
      description: >-
        Requires `observer_configs:create`. Each item is validated like a
        create; an item that fails validation or insertion is skipped and
        counted in `content.failed` rather than aborting the whole import.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties: { file: { type: string, format: binary } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  content:
                    type: object
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/ObserverConfig" } }
                      failed: { type: integer }
        "400": { description: "File is missing, or its content could not be decoded (decode failure body: `{ok: false, error}`)" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/observer_configs/test:
    post:
      tags: [ObserverConfigs]
      summary: Test an unsaved observer config (async)
      description: >-
        Requires `observer_configs:create`. Nothing is observed in the
        request: it only records an `observer_config_test_requests` row and
        returns its id (202). A worker claims it via
        PUT /api/observer_configs/test_requests/pending as a
        `type='observer_test'` job and runs the observe; poll
        GET /api/jobs/for/observer_test/{id} (see /api/jobs/for/{type}/{ref_id})
        for the outcome. `fields`/`mechanism_config` are validated exactly
        as on create, and `properties` against the observable type's
        `properties` schema (the type must have a url-typed property, which
        supplies the URL to observe).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, observable_type_id, fields, mechanism_config, properties]
              properties:
                name: { type: string }
                observable_type_id: { type: integer }
                fields: { type: object, additionalProperties: true }
                mechanism_config: { type: object, additionalProperties: true }
                properties: { type: object, additionalProperties: true, description: "Sample Observable property values to test against." }
      responses:
        "202":
          description: Test request recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer, description: "observer_config_test_requests id - the `ref_id` of the resulting observer_test job." }
        "400": { description: Unknown observable type, fields/mechanism_config/properties failed validation, or the type has no url-typed property }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/observer_configs/{id}/test:
    post:
      tags: [ObserverConfigs]
      summary: Test a saved observer config (async)
      description: >-
        Requires `observer_configs:create`. Same async flow as
        POST /api/observer_configs/test (202 + request id, worker runs an
        `observer_test` job, poll GET /api/jobs/for/observer_test/{id}). If
        `fields` and/or `mechanism_config` are supplied (an edit form's
        unsaved state) those are tested instead of what is persisted;
        omit both to test the saved config as-is.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [properties]
              properties:
                properties: { type: object, additionalProperties: true, description: "Sample Observable property values to test against." }
                fields: { type: object, additionalProperties: true }
                mechanism_config: { type: object, additionalProperties: true }
      responses:
        "202":
          description: Test request recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
        "400": { description: Invalid id, unknown observable type, or fields/mechanism_config/properties failed validation }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Observer config not found }

  /api/observer_configs/test/_all:
    post:
      tags: [ObserverConfigs]
      summary: Test every enabled observer config of an observable type (async)
      description: >-
        Requires `observer_configs:create`. Same async flow as
        POST /api/observer_configs/test (202 + request id, worker runs an
        `observer_test` job, poll GET /api/jobs/for/observer_test/{id}),
        recorded in `mode: all` so the worker tries the sample against
        every enabled config of `observable_type_id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [observable_type_id, properties]
              properties:
                observable_type_id: { type: integer }
                properties: { type: object, additionalProperties: true, description: "Sample Observable property values to test against." }
      responses:
        "202":
          description: Test request recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
        "400": { description: Unknown observable type, properties failed validation, or the type has no url-typed property }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/observer_configs/test_requests/pending:
    put:
      tags: [ObserverConfigs]
      summary: Worker-facing claim of the oldest unclaimed observer config test request
      description: >-
        Requires `workers:write` and `jobs:create`. Atomically (FOR UPDATE SKIP LOCKED, in one
        transaction) picks the oldest test request that has no
        `type='observer_test'` job yet and inserts that job for
        `worker_id` with status `triggering` - so the claim is durable. The
        worker then reports the outcome via
        PUT /api/jobs/observer_test/{ref_id}/{status} (ref_id = `item.id`),
        which the caller sees through GET /api/jobs/for/observer_test/{id}.
        `item` is null when nothing is pending.
      parameters:
        - { name: worker_id, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  item:
                    type: object
                    nullable: true
                    properties:
                      id: { type: integer }
                      config:
                        type: object
                        additionalProperties: true
                        description: >-
                          `{mode: adhoc|saved|all, ...}` - the resolved
                          fields/mechanism_config/properties for adhoc,
                          `observer_config_id` + properties for saved,
                          observable_type_id + properties for all.
                      test_url: { type: string }
        "400": { description: worker_id is missing }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/observer_configs/targets:
    get:
      tags: [ObserverConfigs]
      summary: Worker-facing list of enabled observer configs, as generic observer "targets"
      description: >-
        Requires `workers:write` (not `observer_configs:read`, which is for the admin-facing
        routes). Used by a standalone worker's
        `targets_source = "remote"` observer. Only enabled configs of
        `observable_type_id`, ordered by name, each as
        `{id, name, fields, mechanism_config}`; the worker-side observer plugin
        reshapes them into its own target shape.
      parameters:
